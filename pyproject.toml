[project]
name = "augur"
version = "0.1.0"
description = "AUGUR - Intelligence Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Database / ORM
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "asyncmy>=0.2.0",
    # Data Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP Client
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    # Logging
    "loguru>=0.7.0",
    # Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "aiosqlite>=0.22.1",
    "anthropic>=0.88.0",
    "apscheduler>=3.10.0",
    "markitdown>=0.1.5",
    "pystonic>=2.0.0",
    "click>=8.3.2",
    "playwright>=1.58.0",
    "lxml>=6.0.3",
    "langchain-community>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
collector = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["augur_common", "augur_api", "augur_insight"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
pystonic = { index = "testpypi" }
